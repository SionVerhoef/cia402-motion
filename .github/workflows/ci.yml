name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The frontmatter is what decides whether the skill loads and triggers at all.
      - name: SKILL.md frontmatter is valid
        run: python scripts/check_skill.py

      # This repository is public: no real AMS NetId, IP or MAC address (see CLAUDE.md).
      - name: no real network identities committed
        run: python scripts/check_private.py

      # Manuals and specs are copyrighted and must never land here (see CLAUDE.md).
      - name: no PDFs committed
        run: |
          found=$(git ls-files '*.pdf' '*.PDF')
          [ -z "$found" ] || { echo "PDF files committed:"; echo "$found"; exit 1; }

      - name: cia402.py runs with nothing installed
        run: |
          python scripts/cia402.py decode sw 0x0068
          python scripts/cia402.py plan fault --mode csp

      - name: tests
        run: python -m unittest discover -s tests -v

      # python-canopen (MIT) wrote its CiA 402 tables independently of ours, so it is the
      # oracle: every statusword, homing phase, transition and mode bit must agree. The
      # skill never needs it. The env var turns a missing install into a failure, so this
      # step cannot pass by skipping.
      - name: cross-check against python-canopen
        env:
          CIA402_REQUIRE_CANOPEN: "1"
        run: |
          python -m pip install --quiet canopen==2.4.1
          python -m unittest discover -s tests -p 'test_canopen_oracle.py' -v

      - name: standalone contract
        # Nothing may point outside this repository, and nothing here may claim a
        # certification that does not exist. The bracket around a first letter keeps
        # each pattern from matching this file's own source.
        run: |
          ! grep -rn '\.\./\.\.' --include='*.md' --include='*.py' . || exit 1
          ! grep -rniE 'certified [b]eckhoff' . || exit 1
          ! grep -rnE '/[h]ome/|/[p]rojects/|[C]:\\Users' \
              --include='*.md' --include='*.py' --include='*.yml' . || exit 1

  # Engineers run the tool on Windows, where stdout is a legacy code page.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: tests, on Windows
        run: python -m unittest discover -s tests -v
