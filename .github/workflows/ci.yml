name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The frontmatter is what decides whether the skill loads and triggers at all.
      - name: SKILL.md frontmatter is valid
        run: python scripts/check_skill.py

      # This repository is public: no real AMS NetId, IP or MAC address (see CLAUDE.md).
      - name: no real network identities committed
        run: python scripts/check_private.py

      # Manuals and specs are copyrighted and must never land here (see CLAUDE.md).
      - name: no PDFs committed
        run: |
          found=$(git ls-files '*.pdf' '*.PDF')
          [ -z "$found" ] || { echo "PDF files committed:"; echo "$found"; exit 1; }

      # Runs before anything is installed: the tool must need nothing but Python.
      - name: tests
        run: python -m unittest discover -s tests -v

      # The README promises Python 3.8. setup-python may no longer offer it; uv does.
      - uses: astral-sh/setup-uv@v5
      - name: tests, on Python 3.8
        run: uv run --no-project --python 3.8 python -m unittest discover -s tests

      # python-canopen (MIT) wrote its CiA 402 tables independently of ours, so it is the
      # oracle for statusword states, homing phases, commanded transitions, mode codes and
      # homing-method directions. The skill never needs it. The env var turns a missing
      # install into a failure, so this step cannot pass by skipping.
      - name: cross-check against python-canopen
        env:
          CIA402_REQUIRE_CANOPEN: "1"
        run: |
          python -m pip install --quiet canopen==2.4.1
          python -m unittest discover -s tests -p 'test_canopen_oracle.py' -v

      - name: standalone contract
        # Nothing may point outside this repository, and nothing here may claim a
        # certification that does not exist. The bracket around a first letter keeps
        # each pattern from matching this file's own source.
        run: |
          ! grep -rn '\.\./\.\.' --include='*.md' --include='*.py' . || exit 1
          ! grep -rniE 'certified [b]eckhoff' . || exit 1
          ! grep -rnE '/[h]ome/|/[p]rojects/|[C]:\\Users' \
              --include='*.md' --include='*.py' --include='*.yml' . || exit 1

      # The PLC templates must pass the reviewer and the file check of twincat-st, the
      # skill that owns PLC code. Pinned to a release, so that a new rule there turns this
      # build red only when the pin moves. Last, so the standalone greps above never
      # see that checkout.
      - uses: actions/checkout@v4
        with:
          repository: SionVerhoef/twincat-st
          ref: v0.5.0
          path: .twincat-st
      - name: templates pass twincat-st's reviewer and file check
        run: |
          python .twincat-st/scripts/st_review.py templates/ --fail-on high
          python .twincat-st/scripts/tcpou.py check templates/*.TcPOU templates/*.TcDUT

  # Engineers run the tool on Windows, where stdout is a legacy code page.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: tests, on Windows
        run: python -m unittest discover -s tests -v
